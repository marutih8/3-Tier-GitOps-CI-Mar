name: Node.js CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# permissions:
# contents: write   # required to push to CD repo with GITHUB_TOKEN or PAT

env:
   IMAGE_TAG: ${{ github.sha }}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS recommended)
        uses: actions/setup-node@v4
        with:
          node-version: '23'   # use LTS if you don't need v23

 
      - name: Gitleaks Setup (gitleaks scan)
        uses: gitleaks/gitleaks-action@v2

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1

  
      - name: Run Trivy vulnerability scanner (FS) (trivy scan)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: 
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DockerLogin }}
          password: ${{ secrets.DockerToken }}

      - name: Build and Push Image (backend)
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
           marutih8/backend:latest
           marutih8/backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Docker image (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            marutih8/frontend:latest
            marutih8/frontend:${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name our-cluster --region ${{ secrets.AWS_REGION }}

      - name: Update Image Tags in Manifests
        run: |
          sed -i "s|marutih8/backend:latest|marutih8/backend:${{ env.IMAGE_TAG }}|g" k8s/backend-deployment.yml
          sed -i "s|marutih8/frontend:latest|marutih8/frontend:${{ env.IMAGE_TAG }}|g" k8s/frontend-deployment.yml

      - name: Deploy to EKS
        run: |    
            kubectl apply -f k8s/frontend-deployment.yml -n dev
            kubectl apply -f k8s/backend-deployment.yml -n dev
            kubectl apply -f k8s/frontend-service.yml -n dev
            kubectl apply -f k8s/frontend-service.yml -n dev


      - name: Verify Deployment (deployment)
        run: |    
            kubectl rollout status deployment/frontend -n dev
            kubectl rollout status deployment/backend -n dev      