name: Node.js CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# permissions:
# contents: write   # required to push to CD repo with GITHUB_TOKEN or PAT

#env:
 # IMAGE_TAG: ${{ github.sha }}
 #Errors###########

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS recommended)
        uses: actions/setup-node@v4
        with:
          node-version: '23'   # use LTS if you don't need v23

      - name: Install Dependencies
        # This step is required to get 'eslint' and other packages defined in 'package.json'
        run: npm ci

      - name: 🔎 Run ESLint (Syntax Check & Linting)
        # This command runs the lint script defined in your package.json
        run: npm run lint
    
      - name: Gitleaks Setup (gitleaks scan)
        uses: gitleaks/gitleaks-action@v2

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1

  
      - name: Run Trivy vulnerability scanner (FS) (trivy scan)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  